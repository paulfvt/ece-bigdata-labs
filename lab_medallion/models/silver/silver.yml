models:
  - name: stg_users
    description: One row per user, typed, with the address split into its components.
    columns:
      - name: user_id
        description: Identifier of the user.
        data_tests:
          - unique
          - not_null
      - name: username_normalized
        description: Username without leading/trailing spaces and in lowercase, to compare usernames without case issues.
        data_tests:
          - not_null
          - unique
      - name: birthdate_is_valid
        description: False when the original birthdate is after the first order of the user; the birthdate is then set to NULL.
        data_tests:
          - not_null
      - name: email
        data_tests:
          - unique
          - not_null
      - name: sex
        data_tests:
          - accepted_values:
              arguments:
                values: ["F", "M"]
      - name: state
        description: Two letters code of the state, territory or military region.
        data_tests:
          - not_null
          # relationships to ref('states') removed: no `states` model or seed exists in the lab (see exercise 4)

  - name: stg_orders
    description: One row per order, typed and deduplicated.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id
      - name: quantity
        data_tests:
          - positive
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: product
        data_tests:
          - accepted_values:
              arguments:
                values: ["bread", "brioche", "cookie", "croissant", "donut", "drink"]
